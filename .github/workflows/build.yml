# TotemFix 自动打包（当前阶段：只构建、不发布 Release）
# 触发方式：仓库 Actions 页手动 Run workflow（推标签不再自动触发）
# 产物：构建成功后可在 Actions 的 Artifacts 中下载 TotemFix-windows
name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 运行单元测试
        run: python -m unittest discover -s tests

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 打包单文件 exe
        run: python -m PyInstaller --clean --noconfirm scripts/TotemFix.spec

      - name: 生成 SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\TotemFix.exe -Algorithm SHA256).Hash.ToLower()
          "$h" | Out-File -Encoding ascii dist\TotemFix.exe.sha256

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TotemFix-windows
          path: |
            dist/TotemFix.exe
            dist/TotemFix.exe.sha256
