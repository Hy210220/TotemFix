# TotemFix 自动打包与发布
# 触发方式：
#   1) 推送 v* 标签（如 v2.6.0）→ 自动构建 exe 并发布正式 Release
#   2) 仓库 Actions 页手动 Run workflow（仅构建、上传 Artifact，不发 Release）
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 运行单元测试
        run: python -m unittest discover -s tests

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 打包单文件 exe
        run: python -m PyInstaller --clean --noconfirm scripts/TotemFix.spec

      - name: 生成 SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\TotemFix.exe -Algorithm SHA256).Hash.ToLower()
          "$h" | Out-File -Encoding ascii dist\TotemFix.exe.sha256

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TotemFix-windows
          path: |
            dist/TotemFix.exe
            dist/TotemFix.exe.sha256

      - name: 发布正式 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TotemFix.exe
            dist/TotemFix.exe.sha256
          generate_release_notes: true
